query RunInput {
  cart {
    deliveryGroups {
      id
      deliveryOptions {
        handle
        title
        cost {
          amount
          currencyCode
        }
      }
      cartLines {
        cost {
          subtotalAmount {
            amount
            currencyCode
          }
        }
        merchandise {
          __typename
          ... on ProductVariant {
            product {
              vendor
            }
          }
        }
      }
    }
  }
  discountNode {
    metafield(namespace: "split-ship", key: "rules") {
      value
    }
  }
}
